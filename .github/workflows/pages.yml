name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build static site
        run: |
          set -euxo pipefail
          mkdir -p _site/app
          cat parts/part*.txt > /tmp/packed.html
          python3 <<'PY'
          import base64, gzip, json, pathlib, re

          packed = pathlib.Path('/tmp/packed.html').read_text(encoding='utf-8')
          match = re.search(r'const P=(\{.*?\});\s*async function gunzip64', packed, re.S)
          if not match:
              raise SystemExit('Could not find packed prototype payload')

          payload = json.loads(match.group(1))
          out = pathlib.Path('_site/app')
          out.mkdir(parents=True, exist_ok=True)
          for name, encoded in payload.items():
              data = gzip.decompress(base64.b64decode(encoded))
              (out / name).write_bytes(data)

          app_index = '''<!doctype html>
          <html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Collaborative Order Prototype</title><link rel="stylesheet" href="styles.css"></head><body><div id="boot">Loading Collaborative Order…</div><script>
          (async()=>{
            const [tpl,app]=await Promise.all([fetch('template.html').then(r=>{if(!r.ok) throw new Error('template.html: '+r.status); return r.text()}),fetch('app.js').then(r=>{if(!r.ok) throw new Error('app.js: '+r.status); return r.text()})]);
            document.body.innerHTML=tpl;
            const s=document.createElement('script'); s.type='text/x-dc'; s.setAttribute('data-dc-script',''); s.setAttribute('data-props',JSON.stringify({startScreen:{editor:'enum',options:['Orders','New order','Version history','Access gate','My orders','Customer order','Mobile'],default:'Orders',tsType:'string',section:'Prototype'},showPrototypeBar:{editor:'boolean',default:true,tsType:'boolean',section:'Prototype'},showInternalNotes:{editor:'boolean',default:true,tsType:'boolean',section:'Prototype'}})); s.textContent=app; document.body.appendChild(s);
            await new Promise((ok,fail)=>{const d=document.createElement('script');d.src='design-system.js';d.onload=ok;d.onerror=()=>fail(new Error('design-system.js failed'));document.head.appendChild(d)});
            await new Promise((ok,fail)=>{const r=document.createElement('script');r.src='runtime.js';r.onload=ok;r.onerror=()=>fail(new Error('runtime.js failed'));document.head.appendChild(r)});
          })().catch(e=>{document.body.innerHTML='<pre style="padding:24px;font:14px monospace;color:#b42318">'+String(e.stack||e)+'</pre>'});
          </script></body></html>'''
          (out / 'index.html').write_text(app_index, encoding='utf-8')

          root_index = '''<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Collaborative Order Prototype</title><meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate"></head><body><script>location.replace('./app/?v=' + Date.now())</script><p><a href="./app/">Open Collaborative Order prototype</a></p></body></html>'''
          pathlib.Path('_site/index.html').write_text(root_index, encoding='utf-8')
          PY
          touch _site/.nojekyll
          test -s _site/app/index.html
          test -s _site/app/template.html
          test -s _site/app/app.js
          test -s _site/app/design-system.js
          test -s _site/app/runtime.js
          test -s _site/app/styles.css

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
