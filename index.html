<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Collaborative Order Prototype</title>
</head>
<body style="margin:0;background:#f2f4f7">
  <div style="padding:24px;font:14px Arial,sans-serif">Loading Collaborative Order…</div>
  <script>
    (async () => {
      const names = Array.from({ length: 8 }, (_, i) => `parts/part${String(i).padStart(2, '0')}.txt`);
      const chunks = await Promise.all(names.map(async name => {
        const response = await fetch(name);
        if (!response.ok) throw new Error(`${name}: ${response.status}`);
        return response.text();
      }));
      document.open();
      document.write(chunks.join(''));
      document.close();
    })().catch(err => {
      document.body.innerHTML = '<pre style="padding:24px;font:14px monospace;color:#b42318">' + String(err.stack || err) + '</pre>';
    });
  </script>
</body>
</html>
